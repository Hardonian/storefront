name: storefront-ci
on:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: storefront-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install deps
        working-directory: ai-workspace/repos/storefront
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
          pip install ruff pip-audit
      - name: Compile
        working-directory: ai-workspace/repos/storefront
        run: python -m compileall -q app
      - name: Import application
        working-directory: ai-workspace/repos/storefront
        run: python -c "import app.main; print('import ok')"
      - name: Lint
        working-directory: ai-workspace/repos/storefront
        run: ruff check app tests
      - name: Test storefront
        env:
          STOREFRONT_DOWNLOAD_SECRET: ci-placeholder-secret-not-real
        working-directory: ai-workspace/repos/storefront
        run: python -m pytest tests/ -q -p no:cacheprovider
      - name: Dependency audit
        working-directory: ai-workspace/repos/storefront
        run: pip-audit
